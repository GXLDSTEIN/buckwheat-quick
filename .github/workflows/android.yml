name: Android
on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to verify and release (leave empty for checks only)'
        required: false
        type: string
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
concurrency:
  group: android-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Create temporary test signing key
        run: keytool -genkeypair -keystore "$RUNNER_TEMP/test-signing.jks" -storepass buckwheat-quick -keypass buckwheat-quick -alias buckwheat-quick -keyalg RSA -validity 365 -dname 'CN=CI test build'
      - name: Build and check
        env:
          BUCKWHEAT_KEYSTORE: ${{ runner.temp }}/test-signing.jks
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --console=plain
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Validate tag against APK version
        run: python3 scripts/check_release.py "$RELEASE_TAG"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore permanent release signing key
        env:
          RELEASE_KEY: ${{ secrets.BUCKWHEAT_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEY" || { echo 'Configure BUCKWHEAT_KEYSTORE_BASE64 before releasing'; exit 1; }
          printf '%s' "$RELEASE_KEY" | base64 --decode > "$RUNNER_TEMP/signing.jks"
          chmod 600 "$RUNNER_TEMP/signing.jks"
      - name: Build signed APK
        env:
          BUCKWHEAT_KEYSTORE: ${{ runner.temp }}/signing.jks
          BUCKWHEAT_STORE_PASSWORD: ${{ secrets.BUCKWHEAT_STORE_PASSWORD }}
          BUCKWHEAT_KEY_PASSWORD: ${{ secrets.BUCKWHEAT_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Verify update signing identity and prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/buckwheat-quick.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs release/buckwheat-quick.apk > "$RUNNER_TEMP/certificate.txt"
          python3 scripts/check_release.py "$RELEASE_TAG" --certificate-report "$RUNNER_TEMP/certificate.txt"
          (cd release && sha256sum buckwheat-quick.apk > SHA256SUMS)
      - name: Publish release for Obtainium
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Buckwheat Quick ${RELEASE_TAG#v}" --generate-notes
          fi
          has_apk="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq 'any(.assets[]; .name == "buckwheat-quick.apk")')"
          if [ "$has_apk" != "true" ]; then
            gh release upload "$RELEASE_TAG" release/buckwheat-quick.apk release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
