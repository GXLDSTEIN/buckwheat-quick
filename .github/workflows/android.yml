name: Android
on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Create temporary test signing key
        run: keytool -genkeypair -keystore "$RUNNER_TEMP/test-signing.jks" -storepass buckwheat-quick -keypass buckwheat-quick -alias buckwheat-quick -keyalg RSA -validity 365 -dname 'CN=CI test build'
      - name: Build and check
        env:
          BUCKWHEAT_KEYSTORE: ${{ runner.temp }}/test-signing.jks
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --console=plain
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag against APK version
        run: python3 scripts/check_release.py "$GITHUB_REF_NAME"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore permanent release signing key
        env:
          RELEASE_KEY: ${{ secrets.BUCKWHEAT_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEY" || { echo 'Configure BUCKWHEAT_KEYSTORE_BASE64 before releasing'; exit 1; }
          printf '%s' "$RELEASE_KEY" | base64 --decode > "$RUNNER_TEMP/signing.jks"
          chmod 600 "$RUNNER_TEMP/signing.jks"
      - name: Build signed APK
        env:
          BUCKWHEAT_KEYSTORE: ${{ runner.temp }}/signing.jks
          BUCKWHEAT_STORE_PASSWORD: ${{ secrets.BUCKWHEAT_STORE_PASSWORD }}
          BUCKWHEAT_KEY_PASSWORD: ${{ secrets.BUCKWHEAT_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Verify update signing identity and prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/buckwheat-quick.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs release/buckwheat-quick.apk > "$RUNNER_TEMP/certificate.txt"
          python3 scripts/check_release.py "$GITHUB_REF_NAME" --certificate-report "$RUNNER_TEMP/certificate.txt"
          (cd release && sha256sum buckwheat-quick.apk > SHA256SUMS)
      - name: Publish release for Obtainium
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Buckwheat Quick ${GITHUB_REF_NAME#v}" --generate-notes
          fi
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | rg -Fxq buckwheat-quick.apk; then
            gh release upload "$GITHUB_REF_NAME" release/buckwheat-quick.apk release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
